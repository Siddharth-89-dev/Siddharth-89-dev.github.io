
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build portfolio
        run: npm run build

      - name: Fix asset paths for GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".output/public")

          if not (root / "index.html").exists():
              raise SystemExit("ERROR: .output/public/index.html not found")

          changed = 0

          for file in root.rglob("*"):
              if not file.is_file():
                  continue

              if file.suffix.lower() not in {".html", ".js", ".css"}:
                  continue

              text = file.read_text(encoding="utf-8")

              # Prefix root-relative asset paths with the repository name.
              updated = re.sub(
                  r'(?<![\w./-])/assets/',
                  '/portfolio/assets/',
                  text,
              )

              # Fix the root-relative favicon path.
              updated = updated.replace(
                  'href="/favicon.ico"',
                  'href="/portfolio/favicon.ico"',
              )

              if updated != text:
                  file.write_text(updated, encoding="utf-8")
                  changed += 1

          print(f"Updated asset paths in {changed} files.")

          html = (root / "index.html").read_text(encoding="utf-8")

          if "/portfolio/assets/" not in html:
              raise SystemExit(
                  "ERROR: No /portfolio/assets/ paths found in index.html"
              )

          print("Asset path verification passed.")
          PY

      - name: Verify static build output
        run: |
          echo "Generated public files:"
          find .output/public -maxdepth 2 -type f | sort

          test -f .output/public/index.html
          test -d .output/public/assets

          echo "Static build output verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
